name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get

      # Infos (style hints, deprecations) are reported but don't fail the run;
      # warnings and errors do.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test
